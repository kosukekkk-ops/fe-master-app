<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#FAF8F5">
  <script>
    // 描画前にテーマを適用(ちらつき防止)。設定値: system | light | dark
    // 既定はライト。暗くするときだけ data-theme="dark" を付ける。
    (function () {
      window.__bootShownAt = Date.now();  // 起動ロゴの表示開始時刻(最低表示時間の基準)
      try {
        var pref = JSON.parse(localStorage.getItem('feapp:FE:theme') || '"system"');
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) { /* 既定のライトのまま */ }
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FE対策">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <style>
    /* 起動スプラッシュ。外部CSSより先に描画されるよう、ここにインラインで置く。
       ネイティブはストーリーボード→この画面→アプリとつながり、
       PWA(iOSのネイティブスプラッシュ機構が効かない)でもロゴが出るようにする。 */
    #boot-splash { position: fixed; inset: 0; z-index: 999; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #FAF8F5; transition: opacity .3s ease; }
    html[data-theme="dark"] #boot-splash { background: #131211; }
    #boot-splash.hide { opacity: 0; pointer-events: none; }
    #boot-splash .bs-icon { width: 96px; height: 96px; border-radius: 22px; background: #14161B;
      display: flex; align-items: center; justify-content: center; }
    #boot-splash .bs-circle { width: 64px; height: 64px; border-radius: 50%; background: #4C8DF5;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 28px; letter-spacing: .5px;
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
    #boot-splash .bs-name { margin-top: 28px; font-size: 18px; font-weight: 700; color: #1C1A17; }
    #boot-splash .bs-sub { margin-top: 6px; font-size: 13px; color: #8A857C; letter-spacing: .06em; }
    html[data-theme="dark"] #boot-splash .bs-name { color: #EDEAE4; }
    html[data-theme="dark"] #boot-splash .bs-sub { color: #8B857B; }
  </style>
  <link rel="stylesheet" href="css/style.css">
  <title>受かる基本情報 FE過去問＆単語帳</title>
</head>
<body>
  <div id="boot-splash" aria-hidden="true">
    <div class="bs-icon"><div class="bs-circle">FE</div></div>
    <div class="bs-name">受かる基本情報</div>
    <div class="bs-sub">FE過去問＆単語帳</div>
  </div>
  <div id="app">
    <section id="view-home" class="view active"></section>
    <section id="view-quiz" class="view"></section>
    <section id="view-flash" class="view"></section>
    <section id="view-stats" class="view"></section>
    <section id="view-settings" class="view"></section>
  </div>

  <!-- タブは単色アイコン(絵文字は色数が増える主因のため廃止)。20x20・線幅2 -->
  <nav class="tabbar">
    <button data-tab="home" class="active"><span class="ico"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg></span>ホーム</button>
    <button data-tab="quiz"><span class="ico"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span>演習</button>
    <button data-tab="flash"><span class="ico"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="M7 6V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-1"/></svg></span>単語帳</button>
    <button data-tab="stats"><span class="ico"><svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M6 20v-7M12 20V5M18 20v-4"/></svg></span>ログ</button>
    <button data-tab="settings"><span class="ico"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/></svg></span>設定</button>
  </nav>

  <script src="js/storage.js"></script>
  <script src="js/premium.js"></script>
  <script src="js/data.js"></script>
  <script src="js/word_details.js"></script>
  <script src="js/legal.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
